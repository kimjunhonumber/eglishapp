<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나만의 영어 학습 앱 | eglishapp</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- 상단 헤더 -->
      <header class="app-header">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">📘</span>
          <div>
            <h1>나만의 영어 학습 앱</h1>
            <p class="subtitle">Firebase · 내 계정 전용 클라우드 단어장 (<code>user/{userId}</code>)</p>
          </div>
        </div>

        <div id="auth-section" class="auth-section">
          <button id="login-btn" class="btn btn-google" type="button">
            <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
            </svg>
            <span>Google 계정으로 로그인</span>
          </button>

          <div id="user-profile" class="user-profile hidden">
            <img id="user-avatar" class="user-avatar hidden" src="" alt="프로필 이미지" />
            <div class="user-info">
              <span id="user-name" class="user-name"></span>
              <span id="user-email" class="user-email"></span>
            </div>
            <button id="logout-btn" class="btn btn-outline" type="button">로그아웃</button>
          </div>
        </div>
      </header>

      <!-- 알림 배너 -->
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

      <!-- 비로그인 안내 화면 -->
      <section id="welcome-view" class="welcome-card">
        <div class="welcome-badge">Cloud Firestore 연동 · eglishapp</div>
        <h2>Google 계정으로 로그인하고 영어 학습을 시작하세요</h2>
        <p>
          추가한 영어 단어, 뜻, 예문, 암기 여부는 Firestore의 <code>user/{userId}/words</code> 경로 아래에
          안전하게 저장되며, 본인 계정으로 로그인했을 때만 조회·수정·삭제할 수 있습니다.
        </p>

        <!-- 상태 표시줄 -->
        <div id="auth-status-box" class="auth-status-box hidden"></div>

        <!-- Google 로그인 버튼 영역 -->
        <div class="login-actions-box">
          <button id="welcome-login-btn" class="btn btn-google btn-lg" type="button">
            <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
            </svg>
            <span>Google 계정으로 시작하기 (팝업)</span>
          </button>

          <button id="redirect-login-btn" class="btn btn-outline btn-lg" type="button">
            현재 창에서 Google 로그인하기 (팝업 차단 시)
          </button>
        </div>

        <div class="divider">
          <span>또는 팝업 없이 바로 계정 로그인 / 가입</span>
        </div>

        <!-- 팝업이 차단되는 내장 브라우저/네트워크 환경을 위한 이메일 로그인 폼 -->
        <form id="email-auth-form" class="email-auth-form" novalidate>
          <input
            id="auth-email-input"
            type="email"
            placeholder="이메일 주소 (예: myword@example.com)"
            required
          />
          <input
            id="auth-password-input"
            type="password"
            placeholder="비밀번호 (6자 이상)"
            minlength="6"
            required
          />
          <div class="email-auth-buttons">
            <button id="email-login-btn" class="btn btn-primary" type="submit">
              이메일로 로그인 / 자동 가입
            </button>
            <button id="guest-login-btn" class="btn btn-outline" type="button">
              1초 만에 게스트 계정으로 시작
            </button>
          </div>
        </form>
      </section>

      <!-- 로그인 후 메인 화면 -->
      <main id="app-view" class="main-content hidden">
        <!-- 학습 현황 요약 -->
        <section class="stats-bar" aria-label="단어 학습 통계">
          <div class="stat-card">
            <span class="stat-label">전체 단어</span>
            <strong id="stat-total" class="stat-value">0</strong>
          </div>
          <div class="stat-card stat-memorized">
            <span class="stat-label">외운 단어</span>
            <strong id="stat-memorized" class="stat-value">0</strong>
          </div>
          <div class="stat-card stat-learning">
            <span class="stat-label">학습 중</span>
            <strong id="stat-learning" class="stat-value">0</strong>
          </div>
        </section>

        <div class="workspace-grid">
          <!-- 단어 추가 / 수정 폼 -->
          <section class="form-panel card">
            <div class="panel-header">
              <h2 id="form-title">새 단어 추가</h2>
              <button id="cancel-edit-btn" class="btn btn-text hidden" type="button">수정 취소</button>
            </div>
            <form id="word-form" novalidate>
              <input type="hidden" id="edit-word-id" value="" />

              <div class="form-group">
                <label for="word-input">영어 단어 <span class="required">*</span></label>
                <input
                  id="word-input"
                  type="text"
                  maxlength="200"
                  placeholder="예: serendipity"
                  required
                />
              </div>

              <div class="form-group">
                <label for="meaning-input">뜻 <span class="required">*</span></label>
                <input
                  id="meaning-input"
                  type="text"
                  maxlength="500"
                  placeholder="예: 뜻밖의 행운, 우연한 발견"
                  required
                />
              </div>

              <div class="form-group">
                <label for="example-input">예문</label>
                <textarea
                  id="example-input"
                  rows="3"
                  maxlength="1000"
                  placeholder="예: Finding that cozy cafe was pure serendipity."
                ></textarea>
              </div>

              <div class="form-group checkbox-group">
                <label class="checkbox-label">
                  <input id="memorized-input" type="checkbox" />
                  <span>이 단어를 이미 외웠어요 (외움 완료)</span>
                </label>
              </div>

              <button id="submit-btn" class="btn btn-primary btn-full" type="submit">
                단어장에 저장
              </button>
            </form>
          </section>

          <!-- 단어 목록 패널 -->
          <section class="list-panel">
            <div class="list-controls card">
              <div class="filter-tabs" role="tablist">
                <button class="tab-btn active" data-filter="all" type="button">전체</button>
                <button class="tab-btn" data-filter="learning" type="button">학습 중</button>
                <button class="tab-btn" data-filter="memorized" type="button">외움 완료</button>
              </div>
              <div class="search-box">
                <input
                  id="search-input"
                  type="search"
                  placeholder="단어, 뜻, 예문 검색..."
                  aria-label="단어 검색"
                />
              </div>
            </div>

            <div id="word-list" class="word-list">
              <!-- 단어 카드가 여기에 렌더링됩니다 -->
            </div>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
